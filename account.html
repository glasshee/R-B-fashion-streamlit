<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | R&B Fashion</title>
    <link rel="icon" type="image/png" href="assets/rb-logo.png" />
    <style>
      :root {
        color-scheme: light;
        --black: #090909;
        --gold: #d4af5f;
        @media (max-width: 480px) {
          body {
            place-items: start center;
          }
          .account-card {
            margin: 0 auto;
            padding: 1.5rem 1.25rem;
          }
          h1 {
            font-size: 1.8rem;
          }
        }
        --white: #fff;
        --text: #1d1d1d;
        --muted: #666;
        --line: rgba(0, 0, 0, 0.14);
        --error: #a12620;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px 0;
        color: var(--text);
        background: var(--cream);
        font-family: Arial, Helvetica, sans-serif;
      }
      .account-card {
        width: min(430px, calc(100% - 2rem));
        padding: 2rem;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      .account-logo {
        display: block;
        width: 76px;
        height: 76px;
        margin: 0 auto 1rem;
        object-fit: contain;
        background: #000;
      }
      .field,
      .privacy,
      .account-status {
        text-align: left;
      }
      .field[hidden] {
        display: none;
      }
      .brand {
        margin: 0 0 0.4rem;
        color: #866325;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 2rem;
      }
      .intro {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .field {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 0.85rem;
      }
      label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }
      input {
        min-height: 48px;
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #d4af5f80;
        outline-offset: 2px;
      }
      button {
        min-height: 48px;
        width: 100%;
        padding: 0.8rem 1rem;
        border: 0;
        border-radius: 4px;
        color: var(--white);
        background: var(--black);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      .google-auth {
        display: grid;
        gap: 0.65rem;
      }
      #googleButton {
        display: flex;
        min-height: 44px;
        justify-content: center;
      }
      .google-setup-status {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1.2rem 0;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--line);
      }
      .account-mode-toggle {
        margin-top: 0.5rem;
        padding: 0.5rem;
        color: var(--text);
        background: transparent;
        text-decoration: underline;
      }
      .account-status {
        min-height: 1.3rem;
        margin: 0.8rem 0 0;
        color: var(--error);
        font-size: 0.9rem;
      }
      .privacy {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.4;
      }
      @media (max-width: 480px) {
        .account-card {
          padding: 1.5rem 1.25rem;
        }
        h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="account-card">
      <a href="index.html" aria-label="Return to R&B Fashion home">
        <img
          src="assets/rb-logo.png"
          alt="R&B Fashion logo"
          class="account-logo"
        />
      </a>
      <p class="brand">R&B Fashion / Sunyani</p>
      <h1 id="accountHeading">Welcome to R&amp;B</h1>
      <p class="intro" id="accountIntro">
        Sign in or create an account to save your bag and order details.
      </p>
      <section class="google-auth" aria-label="Continue with Google">
        <div id="googleButton"></div>
        <p
          class="google-setup-status"
          id="googleSetupStatus"
          aria-live="polite"
          hidden
        ></p>
      </section>
      <div class="divider" aria-hidden="true"><span>or use email</span></div>
      <form id="accountForm">
        <div class="field" id="accountNameField">
          <label for="accountName">Full name</label
          ><input
            id="accountName"
            name="name"
            required
            autocomplete="name"
            placeholder="Your full name"
          />
        </div>
        <div class="field">
          <label for="accountEmail">Email</label
          ><input
            id="accountEmail"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          />
        </div>
        <div class="field">
          <label for="accountPassword">Password</label
          ><input
            id="accountPassword"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          />
        </div>
        <button type="submit" id="accountSubmit">
          Create account with email
        </button>
        <button
          type="button"
          class="account-mode-toggle"
          id="accountModeToggle"
        >
          Already have an account? Sign in
        </button>
        <p class="account-status" id="accountStatus" aria-live="polite"></p>
      </form>
      <p class="privacy">
        Your sign-in is protected. Google passwords are never shared with this
        store.
      </p>
    </main>
    <script src="js/account.js"></script>
  </body>
</html>
