<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Forum | R&B Fashion</title>
  <link rel="icon" type="image/png" href="assets/rb-logo.png" />
  <style>
    :root { --black: #090909; --gold: #d4af5f; --cream: #f7f2ea; --white: #fff; --text: #1d1d1d; --muted: #666; --line: rgba(0,0,0,.1); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--cream); font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    .header { position: sticky; top: 0; z-index: 20; background: var(--white); border-bottom: 1px solid var(--line); }
    .header__inner { display: flex; align-items: center; justify-content: space-between; min-height: 74px; gap: 1rem; }
    .brand-logo {
      display: block;
      width: 56px;
      height: 56px;
      object-fit: contain;
      background: #000;
    }
    .nav { display: flex; gap: 1.3rem; font-size: .95rem; font-weight: 600; }
    .nav a { position: relative; padding-bottom: .2rem; }
    .nav a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
    .nav a:hover::after, .nav a.active::after { transform: scaleX(1); }
    .header__actions { display: flex; gap: .8rem; }
    .header__action-btn { display: inline-flex; align-items: center; min-height: 42px; padding: .7rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-weight: 700; }
    .badge { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-left: .3rem; border-radius: 50%; background: var(--gold); font-size: .72rem; }
    .hero { padding: 4.5rem 0 3.5rem; color: var(--white); background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)), url('https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=1600&q=80') center/cover; }
    .hero h1 { margin: 0 0 .8rem; font-size: clamp(2.5rem, 5vw, 4.5rem); letter-spacing: -.05em; }
    .hero p { max-width: 560px; margin: 0; color: rgba(255,255,255,.85); font-size: 1.05rem; line-height: 1.6; }
    .section { padding: 4rem 0; }
    .forum-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr); gap: 2rem; align-items: start; }
    .panel { padding: 1.5rem; background: var(--white); border: 1px solid var(--line); border-radius: 12px; }
    .panel h2 { margin: 0 0 1.25rem; font-size: 1.5rem; }
    .field { display: grid; gap: .45rem; margin-bottom: 1rem; }
    .field label { font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .field input, .field select, .field textarea { width: 100%; padding: .85rem .9rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
    .field textarea { min-height: 120px; resize: vertical; }
    .upload { padding: 1rem; border: 1px dashed rgba(0,0,0,.25); border-radius: 8px; background: #fcfaf7; }
    .upload input { width: 100%; }
    .upload-preview { display: none; width: 100%; max-height: 220px; margin-top: .8rem; object-fit: contain; border-radius: 8px; background: #eee; }
    .submit-btn { width: 100%; padding: .95rem 1rem; border: 0; border-radius: 8px; background: var(--black); color: var(--white); font-weight: 700; }
    .chat { display: grid; gap: .8rem; min-height: 280px; max-height: 480px; overflow-y: auto; padding: 1rem; background: #f7f2ea; border-radius: 8px; }
    .chat-message { max-width: 88%; padding: .8rem .9rem; border-radius: 10px; line-height: 1.5; }
    .chat-message--bot { justify-self: start; background: var(--white); border: 1px solid var(--line); }
    .chat-message--user { justify-self: end; color: var(--white); background: var(--black); }
    .chat-message__label { display: block; margin-bottom: .25rem; color: var(--gold); font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .handoff { display: none; margin-top: 1rem; padding: 1rem; border-left: 3px solid var(--gold); background: #fffaf0; line-height: 1.5; }
    .handoff.is-visible { display: block; }
    .handoff a { display: inline-block; margin-top: .7rem; color: var(--text); font-weight: 700; text-decoration: underline; }
    .footer { padding: 2.5rem 0; color: rgba(255,255,255,.8); background: var(--black); }
    .footer__inner { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    @media (max-width: 820px) { .nav { display: none; } .forum-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" aria-label="R&B Fashion home"><img src="assets/rb-logo.png" alt="R&B Fashion logo" class="brand-logo" /></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="shop.html">Shop</a><a href="men.html">Men</a><a href="women.html">Women</a><a href="shoes.html">Shoes</a><a href="about.html">About</a><a href="forum.html" class="active">Style Forum</a>
      </nav>
      <div class="header__actions"><button type="button" class="header__action-btn">Search</button><a href="#" class="header__action-btn">Bag <span class="badge">0</span></a></div>
    </div>
  </header>

  <main>
    <section class="hero"><div class="container"><h1>Style Forum</h1><p>Have a specific look in mind? Show us the piece, tell us your vibe, and Style Genius Brown will guide your request to the R&B team.</p></div></section>
    <section class="section"><div class="container forum-layout">
      <form class="panel" id="styleRequestForm">
        <h2>Start a request</h2>
        <div class="field"><label for="requestName">Your name</label><input id="requestName" name="name" required placeholder="Your name" /></div>
        <div class="field"><label for="requestContact">Email or WhatsApp</label><input id="requestContact" name="contact" required placeholder="How should we reach you?" /></div>
        <div class="field"><label for="requestFeeling">How are you feeling today?</label><input id="requestFeeling" name="feeling" required placeholder="Tell Style Genius Brown how you feel" /></div>
        <div class="field"><label for="requestType">What are you looking for?</label><input id="requestType" name="type" required placeholder="Type any clothing, shoe, or outfit request" /></div>
        <div class="field"><label for="requestMessage">Describe the look</label><textarea id="requestMessage" name="message" required placeholder="Tell us the colour, size, fit, brand inspiration, or occasion."></textarea></div>
        <div class="field upload"><label for="requestImage">Upload a reference image</label><input id="requestImage" name="image" type="file" accept="image/*" /><img id="uploadPreview" class="upload-preview" alt="Reference preview" /></div>
        <button class="submit-btn" type="submit">Ask Style Genius Brown</button>
      </form>

      <section class="panel" aria-labelledby="chatTitle"><h2 id="chatTitle">Style Genius Brown</h2><div class="chat" id="forumChat"></div><div class="handoff" id="handoffMessage"></div></section>
    </div></section>
  </main>
  <footer class="footer"><div class="container footer__inner"><strong>R&B Fashion</strong><span>Sunyani, Ghana</span></div></footer>
  <script src="js/products.js"></script><script src="js/app.js"></script><script src="js/forum.js"></script>
</body>
</html>
